<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Studio | Відео</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-content" class="hidden">
        <header>
            <nav>
                <div class="logo">Vsevolod Studio</div>
                <ul class="nav-links">
                    <li><a href="index.html" data-lang-key="nav-home">Головна</a></li>
                    <li><a href="forma.html" data-lang-key="nav-prices">Послуги</a></li>
                    <li><a href="skills.html" data-lang-key="nav-skills">Навички</a></li>

                    <li><a href="galery.html" data-lang-key="nav-gallery">Галерея</a></li>
                    <li><a href="Aboutme_index.html" data-lang-key="nav-about">Про мене</a></li>
                    
                    <div class="custom-dropdown">
                        <button class="dropdown-btn" id="current-theme-label">🌓 Тема</button>
                        <div class="dropdown-content">
                            <button onclick="setTheme('dark')">🌙 Темна</button>
                            <button onclick="setTheme('light')">☀️ Ярка</button>
                        </div>
                    </div>
                    
                    <div class="custom-dropdown">
                        <button class="dropdown-btn">🎨 Кольори RGB</button>
                        <div class="dropdown-content rgb-dropdown">
                            <div class="rgb-row"><span>Колір 1</span><input type="color" id="rgb-color-1"></div>
                            <div class="rgb-row"><span>Колір 2</span><input type="color" id="rgb-color-2"></div>
                            <div class="rgb-row"><span>Колір 3</span><input type="color" id="rgb-color-3"></div>
                            <button id="reset-rgb-btn" class="btn-rainbow">Скинути</button>
                        </div>
                    </div>
                    
                    <div class="custom-dropdown">
                        <button class="dropdown-btn" id="current-lang-label">UA</button>
                        <div class="dropdown-content">
                            <button onclick="changeLanguage('uk')">Українська</button>
                            <button onclick="changeLanguage('en')">English</button>
                        </div>
                    </div>
                    <li><button id="btn-logout" class="logout-btn" data-lang-key="nav-logout">Вийти</button></li>
                </ul>
            </nav>
        </header>

        <section class="section">
            <h2 class="section-title" data-lang-key="video-title">Відеоролики</h2>
            <div class="video-grid">
                <div class="video-card">
                    <video src="video1.mp4" controls preload="metadata" style="width:100%; border-radius:8px; background:#000; height:180px; object-fit:cover;"></video>
                    <h3 style="margin-top:10px; font-size:1.1rem;">Анімація розробки сайтів</h3>
                </div>
                <div class="video-card">

                <div class="video-card">
                    <video src="video3.mp4" controls preload="metadata" style="width:100%; border-radius:8px; background:#000; height:180px; object-fit:cover;"></video>
                    <h3 style="margin-top:10px; font-size:1.1rem;">Робота з інтерфейсами</h3>
                </div>
